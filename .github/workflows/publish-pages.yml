name: Publish PARTFLOW site
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'entries/**'
      - 'build-tools/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: partflow-pages
  cancel-in-progress: true
jobs:
  regression:
    uses: ./.github/workflows/test.yml
  deploy:
    needs: regression
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.6.2 --no-audit --no-fund
      - run: npm ci
      - run: npm run build
        env:
          VITE_BATCH_API_BASE: ${{ vars.PARTFLOW_BATCH_API_BASE }}
          VITE_CITY_EXPANSION: ${{ vars.PARTFLOW_CITY_EXPANSION }}
          VITE_CITY_VISIBILITY_V2: ${{ vars.PARTFLOW_CITY_VISIBILITY_V2 }}
          VITE_SHARED_ASSETS: 'true'
          VITE_STORAGE_PHOTOS: ${{ vars.PARTFLOW_STORAGE_PHOTOS }}
          VITE_MARKETPLACE_EXTRAS: ${{ vars.PARTFLOW_MARKETPLACE_EXTRAS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'github-pages-${{ github.run_id }}-${{ github.run_attempt }}';
            for (let attempt = 0; attempt < 24; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, name, per_page: 100
              });
              if (data.artifacts.some(a => a.name === name && !a.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Pages artifact metadata did not become available');
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
