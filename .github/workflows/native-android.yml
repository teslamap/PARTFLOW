name: Native Android APKs
on:
  workflow_dispatch:
  push:
    branches: [main, 'native/**']
    paths: ['native-android/**', '.github/workflows/native-android.yml']
permissions:
  contents: read
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use installed Android SDK
        run: test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test native apps
        working-directory: native-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify actual APKs
        run: |
          python3 native-android/tools/verify_apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: PARTFLOW-native-customer-APK
          path: native-android/apk-output/customer/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PARTFLOW-native-business-APK
          path: native-android/apk-output/business/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PARTFLOW-native-tow-APK
          path: native-android/apk-output/tow/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PARTFLOW-native-superadmin-APK
          path: native-android/apk-output/superadmin/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-reports
          path: |
            native-android/app/build/reports/
            native-android/app/schemas/
          if-no-files-found: warn
