name: Native Android APKs
on:
  workflow_dispatch:
  push:
    branches: [main, 'native/**']
    paths: ['native-android/**', '.github/workflows/native-android.yml']
permissions:
  contents: read
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use installed Android SDK
        run: test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build and test native apps
        working-directory: native-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testCustomerDebugUnitTest :app:lintCustomerDebug :app:lintBusinessDebug :app:lintTowDebug :app:lintSuperadminDebug
      - name: Verify actual APKs
        run: |
          python3 native-android/tools/verify_apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: PARTFLOW-native-customer-APK
          path: native-android/apk-output/customer/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PARTFLOW-native-business-APK
          path: native-android/apk-output/business/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PARTFLOW-native-tow-APK
          path: native-android/apk-output/tow/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PARTFLOW-native-superadmin-APK
          path: native-android/apk-output/superadmin/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-reports
          path: |
            native-android/app/build/reports/
            native-android/app/schemas/
          if-no-files-found: warn
  device-contracts:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm install --global firebase-tools@15.1.0
      - uses: actions/download-artifact@v4
        with:
          pattern: PARTFLOW-native-*-APK
          path: native-android/device-apks
      - name: Test native Firebase workflows on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            chmod +x native-android/gradlew
            mkdir -p native-android/emulator-rules && cp firestore.rules native-android/emulator-rules/firestore.rules
            cd native-android && firebase emulators:exec --only auth,firestore --project demo-partflow --config firebase-emulators.json './gradlew --no-daemon :app:connectedCustomerDebugAndroidTest'
            bash native-android/tools/device_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-device-contract-results
          path: |
            native-android/app/build/reports/androidTests/
            native-android/device-screenshots/
          if-no-files-found: warn
