name: Build and security regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global npm@11.6.2 --no-audit --no-fund
      - run: npm ci
      - run: npm run check
      - run: node tests/foundation.mjs
      - run: node tests/features.mjs && node tests/api-features.mjs && node tests/ai-provider.mjs
      - run: npm run build:mobile
      - run: npm run test:business
      - run: npm run test:push
      - run: npm run test:install
      - run: npm run test:android-identity
      - run: npx firebase-tools emulators:exec --only firestore --project demo-partflow "npm run test:rules && node tests/api-transactions.mjs && node tests/otp-transactions.mjs"
