name: Build and security regression tests
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global npm@11.6.2 --no-audit --no-fund
      - run: npm ci
      - run: npm run check
      - run: npm run test:towing
      - run: npm run test:maps
      - run: node tests/foundation.mjs
      - run: node tests/batch-policy.mjs && node build-tools/prepare-api.mjs
      - run: node tests/features.mjs && node tests/api-features.mjs && node tests/ai-provider.mjs && node tests/vehicle.mjs && node tests/second-batch.mjs && node tests/notifications.mjs && node tests/referrals.mjs
      - run: npm run build:mobile
      - run: npm run test:business
      - run: npm run test:push
      - run: npm run test:install
      - run: npm run test:android-identity
      - run: npx firebase-tools emulators:exec --only firestore --project demo-partflow "npm run test:rules && node tests/api-transactions.mjs && node tests/otp-transactions.mjs && node tests/batch-transactions.mjs && node tests/expansion-rules.mjs && npm run test:towing:rules && npm run test:maps:rules"
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.6.2 --no-audit --no-fund
      - run: npm ci
      - name: Build and validate shared production assets
        env:
          VITE_SHARED_ASSETS: 'true'
          VITE_CITY_VISIBILITY_V2: 'true'
          VITE_CITY_EXPANSION: 'true'
          VITE_STORAGE_PHOTOS: 'true'
          VITE_MARKETPLACE_EXTRAS: 'true'
        run: npm run build:mobile && node tests/shared-build.mjs
      - name: Browser smoke tests (no production network)
        run: |
          npm install --prefix /tmp/partflow-browser --no-audit --no-fund playwright@1.56.1
          /tmp/partflow-browser/node_modules/.bin/playwright install --with-deps chromium
          node tests/browser-smoke.mjs
  audit-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.6.2 --no-audit --no-fund
      - run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Storage, Auth claims, city migration and large live data integration
        run: npx firebase-tools emulators:exec --only firestore,auth,storage --project demo-partflow "node tests/audit-integration.mjs"
