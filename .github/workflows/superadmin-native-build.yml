name: Superadmin Native APK (isolated)
on:
  push:
    branches: [feature/superadmin-native-build]
    paths:
      - 'native/superadmin/**'
      - '.github/workflows/superadmin-native-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/superadmin/**'
      - '.github/workflows/superadmin-native-build.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$sdk"
          "$sdk" --version
          yes | "$sdk" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$sdk" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack isolated Android sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p superadmin-build
          sed '1d;$d' native/superadmin/source-v19.tar.xz.base64.txt | tr -d '\r\n' | base64 -d > /tmp/superadmin.tar.xz
          tar -xJf /tmp/superadmin.tar.xz -C superadmin-build
          test -f superadmin-build/app/build.gradle.kts
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8\n' > superadmin-build/gradle.properties
      - name: Compile native APK
        working-directory: superadmin-build
        env:
          PARTFLOW_FIREBASE_ANDROID_APP_ID: ${{ secrets.PARTFLOW_FIREBASE_ANDROID_APP_ID }}
          PARTFLOW_FIREBASE_API_KEY: ${{ secrets.PARTFLOW_FIREBASE_API_KEY }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload compiled APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: partflow-superadmin-native-debug
          path: superadmin-build/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
