name: PARTFLOW Native Customer Debug
on:
  workflow_dispatch:
  push:
    branches: [native/customer-compose-20261103]
    paths: ['native-customer/**', '.github/workflows/native-customer-debug.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Native APK
        working-directory: native-customer
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PARTFLOW-customer-native-debug
          path: native-customer/app/build/outputs/apk/debug/*.apk
