name: PARTFLOW Native Customer Debug
on:
  workflow_dispatch:
  push:
    branches: [native/customer-compose-20261103]
    paths: ['native-customer/**', '.github/workflows/native-customer-debug.yml']
permissions:
  contents: write
concurrency:
  group: native-customer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    uses: ./.github/workflows/test.yml
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Assemble and lint native app
        working-directory: native-customer
        run: gradle --no-daemon assembleDebug lintDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            (cd native-customer && gradle --no-daemon connectedDebugAndroidTest)
            adb install -r native-customer/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n ge.partflow.customer.preview/ge.partflow.customer.MainActivity
            sleep 5
            adb shell pidof ge.partflow.customer.preview
            mkdir -p evidence
            adb shell screencap -p /sdcard/login.png
            adb pull /sdcard/login.png evidence/login.png
            adb pull /sdcard/Android/data/ge.partflow.customer.preview/files/evidence evidence/components
      - name: Verify standalone signed APK
        run: |
          APK=native-customer/app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK"
          cp "$APK" PARTFLOW-customer-native.apk
          sha256sum PARTFLOW-customer-native.apk > PARTFLOW-customer-native.apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PARTFLOW-native-validation
          path: |
            native-customer/app/build/reports/
            evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: PARTFLOW-customer-native-debug
          path: PARTFLOW-customer-native.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "native-customer-${GITHUB_RUN_ID}" PARTFLOW-customer-native.apk PARTFLOW-customer-native.apk.sha256 --target "$GITHUB_SHA" --prerelease --title "PARTFLOW Native Customer 0.2 preview" --notes "Native Kotlin/Compose customer preview. Build, lint, emulator installation, launch and UI regression tests passed. This is a debug-signed preview, not a production release. See native-customer/README.md for remaining gaps."
