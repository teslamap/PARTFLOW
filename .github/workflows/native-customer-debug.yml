name: PARTFLOW Native Customer Debug
on:
  workflow_dispatch:
  push:
    branches: [native/customer-compose-20261103]
    paths: ['native-customer/**', '.github/workflows/native-customer-debug.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Native APK
        working-directory: native-customer
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PARTFLOW-customer-native-debug
          path: native-customer/app/build/outputs/apk/debug/*.apk
